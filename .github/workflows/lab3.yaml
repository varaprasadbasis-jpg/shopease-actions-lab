on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shopease-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ShopEase Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # Step 4: Verify Python version
      - name: Verify Python environment
        run: |
          python --version
          python -m pip --version

      # Step 5: Run application tests
      - name: Run tests
        run: |
          python -m pytest -v test_app.py

      # Step 6: Check Dockerfile
      - name: Validate Dockerfile
        run: |
          test -s Dockerfile
          echo "Dockerfile exists and is not empty."

      # Step 7: Generate workflow summary
      - name: Create CI summary
        if: always()
        env:
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "## ShopEase CI Pipeline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | REPOSITORY|">>"GITHUB_STEP_SUMMARY"
          echo "| Trigger | EVENT|">>"GITHUB_STEP_SUMMARY"
          echo "| Branch | BRANCH|">>"GITHUB_STEP_SUMMARY"
          echo "| Commit | COMMIT|">>"GITHUB_STEP_SUMMARY"
          echo "| Started by | ACTOR|">>"GITHUB_STEP_SUMMARY"
          echo "| Job status | JOBSTATUS|">>"GITHUB_STEP_SUMMARY"
